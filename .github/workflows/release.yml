name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.2.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Check manifest version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].strip()
          if version.startswith("v"):
              raise SystemExit("Enter the release version without the v prefix")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Invalid release version: {version}")

          manifest = json.loads(
              Path("custom_components/xiaoling_mcp/manifest.json").read_text()
          )
          if manifest.get("version") != version:
              raise SystemExit(
                  f"manifest.json has version {manifest.get('version')!r}, expected {version!r}"
              )
          PY
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements_test.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    uses: home-assistant/actions/hassfest/.github/workflows/hassfest.yml@master

  publish:
    name: Create GitHub release
    needs:
      - verify
      - hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
